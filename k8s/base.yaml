apiVersion: v1
kind: Namespace
metadata: {name: gudang-kita}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: gudang-kita, namespace: gudang-kita}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata: {name: gudang-kita, namespace: gudang-kita}
spec: {selector: {app: gudang-kita}, ports: [{port: 80, targetPort: http}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gudang-kita, namespace: gudang-kita}
spec:
  replicas: 3
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: gudang-kita}}
  template:
    metadata: {labels: {app: gudang-kita}}
    spec:
      serviceAccountName: gudang-kita
      securityContext: {runAsNonRoot: true, runAsUser: 33, fsGroup: 33, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: app
        # Image lokal Docker Desktop untuk demo Kubernetes. Ganti dengan image digest registry saat production.
        image: inventory-app_v3-app:v1.0.0
        imagePullPolicy: IfNotPresent
        ports: [{name: http, containerPort: 8080}]
        envFrom: [{secretRef: {name: gudang-kita-runtime}}]
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
        volumeMounts:
        - {name: apache-runtime, mountPath: /var/run/apache2}
        - {name: apache-lock, mountPath: /var/lock/apache2}
        - {name: apache-log, mountPath: /var/log/apache2}
        - {name: tmp, mountPath: /tmp}
        startupProbe: {httpGet: {path: /health/startup, port: http}, failureThreshold: 30, periodSeconds: 5}
        readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 10}
      volumes:
      - {name: apache-runtime, emptyDir: {}}
      - {name: apache-lock, emptyDir: {}}
      - {name: apache-log, emptyDir: {}}
      - {name: tmp, emptyDir: {}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: gudang-kita, namespace: gudang-kita}
spec: {minReplicas: 3, maxReplicas: 10, scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: gudang-kita}, metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}}]}
